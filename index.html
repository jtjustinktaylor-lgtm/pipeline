<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0a">
<title>Pipeline</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0a;--bg2:#111;--bg3:#1a1a1a;--bg4:#222;--accent:#00ff88;--accent2:#00cc6a;--accent-dim:rgba(0,255,136,.1);--text:#e0e0e0;--text2:#888;--border:#2a2a2a;--danger:#ff4444;--warn:#ffaa00;--info:#00aaff;--radius:12px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;overflow-x:hidden;padding-bottom:80px;-webkit-tap-highlight-color:transparent}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
a{color:var(--accent);text-decoration:none}

.header{position:sticky;top:0;z-index:100;background:rgba(10,10,10,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.header h1{font-size:17px;font-weight:800;display:flex;align-items:center;gap:6px;letter-spacing:-.3px}
.header h1 .logo{color:var(--accent)}
.header-right{display:flex;gap:6px;align-items:center}
.offline-badge{font-size:10px;background:var(--warn);color:#000;padding:2px 8px;border-radius:10px;font-weight:700;display:none}
.offline-badge.show{display:inline-block}
.hdr-btn{background:var(--bg3);border:1px solid var(--border);color:var(--text);width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,10,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;z-index:100;padding-bottom:max(env(safe-area-inset-bottom),8px)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 2px;cursor:pointer;color:var(--text2);transition:.15s;font-size:9px;gap:2px;font-weight:600;letter-spacing:.3px}
.nav-item.active{color:var(--accent)}
.nav-item .ni{font-size:20px;line-height:1}
.nav-item:active{transform:scale(.85)}

.page{display:none;padding:12px 16px;animation:fadeUp .15s ease}
.page.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.search-box{position:relative;margin-bottom:12px}
.search-box input{width:100%;background:var(--bg2);border:1px solid var(--border);color:var(--text);padding:10px 12px 10px 38px;border-radius:var(--radius);font-size:14px;outline:none;transition:.2s}
.search-box input:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-dim)}
.search-box .si{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.5}

.stats{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.stats::-webkit-scrollbar{display:none}
.chip{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:11px;white-space:nowrap;display:flex;align-items:center;gap:4px}
.chip b{color:var(--accent)}

.breadcrumb{display:flex;align-items:center;gap:2px;margin-bottom:10px;flex-wrap:wrap;font-size:12px}
.breadcrumb span{cursor:pointer;color:var(--accent);padding:3px 6px;border-radius:6px}
.breadcrumb span:active{background:var(--accent-dim)}
.breadcrumb .sep{color:var(--text2);cursor:default;padding:0 2px}
.breadcrumb .cur{color:var(--text);cursor:default;font-weight:600}

.section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--accent);margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.section-title::after{content:'';flex:1;height:1px;background:var(--border)}

.folder-item{display:flex;align-items:center;gap:12px;padding:14px;background:linear-gradient(135deg,var(--bg2),var(--bg3));border:1px solid var(--border);border-radius:var(--radius);margin-bottom:6px;cursor:pointer;transition:.15s}
.folder-item:active{transform:scale(.98);border-color:var(--accent)}
.folder-item .fi{font-size:28px;flex-shrink:0}
.folder-item .finfo{flex:1;min-width:0}
.folder-item .fn{font-size:14px;font-weight:700}
.folder-item .fc{font-size:11px;color:var(--text2);margin-top:2px}
.folder-item .arrow{color:var(--text2);font-size:18px}

.file-item{display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;margin-bottom:5px;cursor:pointer;transition:.15s}
.file-item:active{transform:scale(.98);background:var(--bg3)}
.file-item .fi{font-size:24px;flex-shrink:0;width:30px;text-align:center}
.file-item .finfo{flex:1;min-width:0}
.file-item .fn{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-item .fm{font-size:10px;color:var(--text2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-item .arrow{color:var(--text2);font-size:14px;flex-shrink:0}

.viewer-overlay{position:fixed;inset:0;background:var(--bg);z-index:200;display:none;flex-direction:column}
.viewer-overlay.open{display:flex}
.v-header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);background:var(--bg2);flex-shrink:0}
.v-close{background:none;border:none;color:var(--accent);font-size:22px;cursor:pointer;padding:4px 8px}
.v-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.v-actions{display:flex;gap:4px}
.v-btn{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:5px 10px;border-radius:8px;font-size:11px;cursor:pointer;white-space:nowrap}
.v-content{flex:1;overflow:auto;padding:14px;-webkit-overflow-scrolling:touch}
.v-content pre{background:var(--bg2);padding:12px;border-radius:8px;overflow-x:auto;font-size:12px;line-height:1.5;font-family:'SF Mono',Monaco,Consolas,monospace;white-space:pre-wrap;word-break:break-word}
.v-content img{max-width:100%;border-radius:8px}
.v-content audio,.v-content video{width:100%;border-radius:8px}
.v-content table{width:100%;border-collapse:collapse;font-size:12px}
.v-content th,.v-content td{padding:6px 8px;border:1px solid var(--border);text-align:left}
.v-content th{background:var(--bg3);font-weight:600}

.md-body{line-height:1.65;font-size:14px}
.md-body h1,.md-body h2,.md-body h3{color:var(--accent);margin:16px 0 8px}
.md-body h1{font-size:20px;border-bottom:1px solid var(--border);padding-bottom:8px}
.md-body h2{font-size:17px}
.md-body h3{font-size:14px}
.md-body p{margin:8px 0}
.md-body code{background:var(--bg3);padding:1px 5px;border-radius:4px;font-size:12px;font-family:'SF Mono',Monaco,Consolas,monospace}
.md-body pre{background:var(--bg2);padding:12px;border-radius:8px;overflow-x:auto}
.md-body pre code{background:none;padding:0}
.md-body ul,.md-body ol{padding-left:20px;margin:8px 0}
.md-body li{margin:3px 0}
.md-body a{color:var(--accent)}
.md-body blockquote{border-left:3px solid var(--accent);padding-left:12px;color:var(--text2);margin:8px 0}
.md-body table{width:100%;border-collapse:collapse;margin:8px 0}
.md-body th,.md-body td{padding:8px;border:1px solid var(--border)}
.md-body th{background:var(--bg3)}
.md-body strong{color:#fff}
.md-body hr{border:none;border-top:1px solid var(--border);margin:16px 0}

.upload-zone{border:2px dashed var(--border);border-radius:16px;padding:32px 16px;text-align:center;cursor:pointer;transition:.2s;margin-bottom:12px}
.upload-zone:active,.upload-zone.dragover{border-color:var(--accent);background:var(--accent-dim)}
.upload-zone .uz-icon{font-size:40px;margin-bottom:8px}
.upload-zone p{color:var(--text2);font-size:13px}
.upload-zone input{display:none}

.link-item{display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;margin-bottom:5px;cursor:pointer;transition:.15s;color:var(--text);text-decoration:none}
.link-item:active{transform:scale(.98);background:var(--bg3)}
.link-item .li{font-size:22px;width:30px;text-align:center;flex-shrink:0}
.link-item .linfo{flex:1;min-width:0}
.link-item .ln{font-size:13px;font-weight:600}
.link-item .lu{font-size:10px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link-item .arrow{color:var(--text2);font-size:14px;flex-shrink:0}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:150;display:none;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:16px 16px 0 0;width:100%;max-height:80vh;overflow:auto;padding:20px;padding-bottom:max(20px,env(safe-area-inset-bottom));animation:slideUp .2s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
.modal h2{font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.modal-close{float:right;background:none;border:none;color:var(--text2);font-size:20px;cursor:pointer}
.zip-file{display:flex;align-items:center;gap:8px;padding:8px;background:var(--bg);border-radius:8px;margin-bottom:4px;font-size:12px}
.zip-file .zf-icon{font-size:16px}
.zip-file .zf-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:monospace}
.zip-file .zf-size{color:var(--text2);font-size:10px}
.modal-actions{display:flex;gap:8px;margin-top:14px}
.modal-btn{flex:1;padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-size:13px;cursor:pointer;text-align:center;font-weight:600}
.modal-btn.primary{background:var(--accent);color:#000;border-color:var(--accent)}

.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--accent);color:var(--text);padding:10px 20px;border-radius:12px;font-size:13px;z-index:300;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap;backdrop-filter:blur(10px)}
.toast.show{opacity:1}

.empty{text-align:center;padding:40px 20px;color:var(--text2)}
.empty .ei{font-size:48px;margin-bottom:10px}

.spinner{display:inline-block;width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.repo-header{background:linear-gradient(135deg,var(--bg3),var(--bg2));border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:8px;cursor:pointer}
.repo-header:active{border-color:var(--accent)}
.repo-header .rh-top{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.repo-header .rh-name{font-size:14px;font-weight:700;flex:1}
.repo-header .rh-lang{font-size:10px;background:var(--bg);border:1px solid var(--border);padding:2px 8px;border-radius:10px}
.repo-header .rh-desc{font-size:11px;color:var(--text2);line-height:1.3}
.repo-header .rh-meta{font-size:10px;color:var(--text2);margin-top:6px;display:flex;gap:12px}
</style>
</head>
<body>

<div class="header">
  <h1>⚡ <span class="logo">Pipeline</span></h1>
  <div class="header-right">
    <span class="offline-badge" id="offline-badge">OFFLINE</span>
    <button class="hdr-btn" onclick="syncWorkspaceFiles(true)" title="Sync workspace files">🔄</button>
  </div>
</div>

<div class="page active" id="page-files">
  <div class="search-box"><span class="si">🔍</span><input type="text" id="file-search" placeholder="Search files..." oninput="filterFiles(this.value)"></div>
  <div class="stats" id="stats-bar"></div>
  <div id="breadcrumb" class="breadcrumb"></div>
  <div id="file-list"></div>
</div>

<div class="page" id="page-repos">
  <div class="search-box"><span class="si">🔍</span><input type="text" id="repo-search" placeholder="Search repos..." oninput="filterRepos(this.value)"></div>
  <div id="repo-list"></div>
</div>

<div class="page" id="page-links">
  <div class="search-box"><span class="si">🔍</span><input type="text" id="link-search" placeholder="Search links..." oninput="filterLinks(this.value)"></div>
  <div id="link-list"></div>
</div>

<div class="page" id="page-upload">
  <div class="section-title">📤 Upload Files</div>
  <div class="upload-zone" id="upload-zone" onclick="document.getElementById('file-input').click()">
    <div class="uz-icon">📁</div>
    <p><strong>Tap to upload</strong> or drag files here</p>
    <p style="font-size:10px;margin-top:4px;color:var(--text2)">Any file type • Stored locally for offline access</p>
    <input type="file" id="file-input" multiple onchange="handleUpload(this.files)">
  </div>
  <div class="section-title">📦 Extract ZIP Archive</div>
  <div class="upload-zone" onclick="document.getElementById('zip-input').click()" style="padding:20px">
    <p><strong>Upload ZIP</strong> to extract & browse contents</p>
    <input type="file" id="zip-input" accept=".zip" onchange="handleZipUpload(this.files)">
  </div>
  <div class="section-title">💾 Stored Files</div>
  <div id="uploaded-list"></div>
</div>

<div class="page" id="page-viewer">
  <div class="empty"><div class="ei">📖</div><p>Tap any file to view it here</p></div>
</div>

<div class="bottom-nav">
  <div class="nav-item active" onclick="switchPage('files')"><span class="ni">📁</span>Files</div>
  <div class="nav-item" onclick="switchPage('repos')"><span class="ni">🐙</span>Repos</div>
  <div class="nav-item" onclick="switchPage('links')"><span class="ni">🔗</span>Links</div>
  <div class="nav-item" onclick="switchPage('upload')"><span class="ni">📤</span>Upload</div>
  <div class="nav-item" onclick="switchPage('viewer')"><span class="ni">📖</span>Viewer</div>
</div>

<div class="viewer-overlay" id="viewer-overlay">
  <div class="v-header">
    <button class="v-close" onclick="closeViewer()">✕</button>
    <div class="v-title" id="v-title">File</div>
    <div class="v-actions">
      <button class="v-btn" onclick="shareCurrent()">↗</button>
      <button class="v-btn" onclick="downloadCurrent()">⬇️</button>
    </div>
  </div>
  <div class="v-content" id="v-content"></div>
</div>

<div class="modal-overlay" id="zip-modal">
  <div class="modal">
    <button class="modal-close" onclick="closeZipModal()">✕</button>
    <h2>📦 ZIP Contents</h2>
    <div id="zip-info" style="font-size:11px;color:var(--text2);margin-bottom:8px"></div>
    <div id="zip-files"></div>
    <div class="modal-actions">
      <button class="modal-btn" onclick="closeZipModal()">Cancel</button>
      <button class="modal-btn primary" onclick="extractAllZip()">Extract All</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/jszip@3/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>

// INDEXEDDB
// ============================================================
function initDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,DBV);r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'id'})};r.onsuccess=e=>{db=e.target.result;res(db)};r.onerror=e=>rej(e)})}
function dbPut(f){return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(f);tx.oncomplete=()=>res();tx.onerror=e=>rej(e)})}
function dbAll(){return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readonly');const r=tx.objectStore(STORE).getAll();r.onsuccess=()=>res(r.result);r.onerror=e=>rej(e)})}
function dbGet(id){return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readonly');const r=tx.objectStore(STORE).get(id);r.onsuccess=()=>res(r.result);r.onerror=e=>rej(e)})}
function dbDel(id){return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(id);tx.oncomplete=()=>res();tx.onerror=e=>rej(e)})}

async function renderFiles(){
  const c=document.getElementById('file-list'),bc=document.getElementById('breadcrumb'),sb=document.getElementById('stats-bar');
  let tf=0;Object.values(WS).forEach(cat=>{if(cat.files)tf+=cat.files.length;else Object.values(cat).forEach(s=>{if(s&&s.files)tf+=s.files.length})});
  // Update stats to show workspace count
  const wsFiles=await dbAll().then(f=>f.filter(x=>x.src==='ws')).catch(()=>[]);
  const wsCount=wsFiles.length;
  sb.innerHTML=`<div class="chip">📁 <b>${tf}</b> paths</div><div class="chip">💾 <b>${wsCount}</b> cached</div><div class="chip">🐙 <b>${REPOS.length}</b> repos</div><span id="sync-status" style="font-size:10px;color:var(--text2)"></span>`;

  if(curPath.length===0){bc.innerHTML='<span class="cur">🏠 Home</span>'}
  else{let h='<span onclick="navTo([])">🏠</span>';curPath.forEach((p,i)=>{h+='<span class="sep">›</span>';h+=i===curPath.length-1?`<span class="cur">${p}</span>`:`<span onclick="navTo(${JSON.stringify(curPath.slice(0,i+1))})">${p}</span>`});bc.innerHTML=h}

  let items=[];
  if(curPath.length===0){Object.entries(WS).forEach(([cn,cd])=>{const cnt=cd.files?cd.files.length:Object.keys(cd).length;items.push({n:cn,t:'cat',c:cnt})})}
  else if(curPath.length===1){const cat=WS[curPath[0]];if(cat&&cat.files)cat.files.forEach(f=>items.push(f));else if(cat)Object.entries(cat).forEach(([sn,sd])=>{if(sd&&sd.files)items.push({n:sn,t:'sub',c:sd.files.length,files:sd.files})})}
  else if(curPath.length===2){const cat=WS[curPath[0]];if(cat&&!cat.files){const sub=cat[curPath[1]];if(sub&&sub.files)sub.files.forEach(f=>items.push(f))}}

  c.innerHTML=items.map(item=>{
    if(item.t==='cat'||item.t==='sub'){
      return`<div class="folder-item" onclick="navTo(${JSON.stringify([...curPath,item.n])})"><span class="fi">📂</span><div class="finfo"><div class="fn">${item.n}</div><div class="fc">${item.c} items</div></div><span class="arrow">›</span></div>`;
    }
    const e=ext(item.n),isF=item.t==='folder';
    const click=isF?`navTo(${JSON.stringify([...curPath,item.n.replace(/\/$/,'')])})`:`viewWSFile('${item.p||item.n}','${item.n}','${item.t||e}')`;
    return`<div class="file-item" onclick="${click}"><span class="fi">${gi(isF?'folder':e)}</span><div class="finfo"><div class="fn">${item.n}</div><div class="fm">${item.d||item.s||''}</div></div><span class="arrow">${isF?'›':'👁️'}</span></div>`;
  }).join('');
}

    try{
      if(['png','jpg','jpeg','gif','webp','bmp'].includes(e)){const u=URL.createObjectURL(stored.blob);c.innerHTML=`<img src="${u}" alt="${name}">`}
      else if(['mp3','wav','ogg','m4a'].includes(e)){const u=URL.createObjectURL(stored.blob);c.innerHTML=`<div style="text-align:center;padding:20px"><div style="font-size:60px;margin-bottom:14px">🎵</div><h3>${name}</h3><audio controls src="${u}" style="width:100%;max-width:400px;margin-top:12px"></audio></div>`}
      else if(e==='md'){const txt=await stored.blob.text();c.innerHTML=`<div class="md-body">${marked.parse(txt)}</div>`}

      else if(['js','ts','tsx','jsx','py','html','css','sh','sol','yaml','yml','xml','go'].includes(e)){const txt=await stored.blob.text();c.innerHTML=`<pre>${synHL(esc(txt))}</pre>`}
      else if(e==='csv'){const txt=await stored.blob.text();c.innerHTML=csvTbl(txt)}
      else{const txt=await stored.blob.text();c.innerHTML=`<pre>${esc(txt)}</pre>`}
    }catch(err){c.innerHTML=`<div class="empty"><div class="ei">⚠️</div><p>${err.message}</p></div>`}
    return;
  }
  
  // Fallback: show info card with GitHub link

  c.innerHTML=`

    </div>`;
  o.classList.add('open');
}

  c.innerHTML='<div style="text-align:center;padding:40px"><div class="spinner"></div></div>';
  o.classList.add('open');
  const e=ext(file.name);
  try{
    if(['png','jpg','jpeg','gif','webp','bmp'].includes(e)){const u=URL.createObjectURL(file.blob);c.innerHTML=`<img src="${u}" alt="${file.name}">`}
    else if(['mp3','wav','ogg','m4a','flac'].includes(e)){const u=URL.createObjectURL(file.blob);c.innerHTML=`<div style="text-align:center;padding:20px"><div style="font-size:60px;margin-bottom:14px">🎵</div><h3 style="margin-bottom:14px">${file.name}</h3><audio controls src="${u}" style="width:100%;max-width:400px"></audio></div>`}
    else if(['mp4','webm','mov'].includes(e)){const u=URL.createObjectURL(file.blob);c.innerHTML=`<video controls src="${u}" style="width:100%;border-radius:8px"></video>`}
    else if(e==='pdf'){const u=URL.createObjectURL(file.blob);c.innerHTML=`<iframe src="${u}" style="width:100%;height:100%;border:none"></iframe>`}
    else if(e==='md'){const txt=await file.blob.text();c.innerHTML=`<div class="md-body">${marked.parse(txt)}</div>`}
    else if(['txt','log','rtf','env','gitignore','cfg','ini'].includes(e)){const txt=await file.blob.text();c.innerHTML=`<pre>${esc(txt)}</pre>`}
    else if(e==='json'){const txt=await file.blob.text();try{c.innerHTML=`<pre>${synHL(JSON.stringify(JSON.parse(txt),null,2))}</pre>`}catch{c.innerHTML=`<pre>${esc(txt)}</pre>`}}
    else if(['js','ts','py','html','css','sh','sol','yaml','yml','xml','jsx','tsx','go','rs'].includes(e)){const txt=await file.blob.text();c.innerHTML=`<pre>${synHL(esc(txt))}</pre>`}
    else if(e==='csv'){const txt=await file.blob.text();c.innerHTML=csvTbl(txt)}
    else if(e==='svg'){c.innerHTML=await file.blob.text()}
    else{try{const txt=await file.blob.text();if(txt.length<500000&&/[\x20-\x7E\n\r\t]/.test(txt.slice(0,1000))){c.innerHTML=`<pre>${esc(txt)}</pre>`}else throw 0}catch{const u=URL.createObjectURL(file.blob);c.innerHTML=`<div style="text-align:center;padding:40px"><div style="font-size:60px;margin-bottom:14px">${gi(e)}</div><h3>${file.name}</h3><p style="color:var(--text2)">${fs(file.blob.size)}</p><a href="${u}" download="${file.name}" style="display:inline-block;padding:12px 24px;background:var(--accent);color:#000;border-radius:10px;font-weight:700;margin-top:12px">⬇️ Download</a></div>`}}
  }catch(err){c.innerHTML=`<div class="empty"><div class="ei">⚠️</div><p>${err.message}</p></div>`}
}

  c.innerHTML=files.map(f=>`<div class="file-item"><span class="fi">${gi(f.ext)}</span><div class="finfo" onclick="viewStored(${JSON.stringify({name:f.name,blob:f.blob}).replace(/"/g,'&quot;')})"><div class="fn">${f.name}</div><div class="fm">${fs(f.size)} • ${new Date(f.at).toLocaleDateString()}</div></div><button onclick="delStored('${f.id}')" style="background:none;border:none;color:var(--danger);font-size:14px;cursor:pointer;padding:4px 8px">🗑️</button></div>`).join('');
}
async function delStored(id){await dbDel(id);renderUploaded();updUC();toast('🗑️ Deleted')}
async function updUC(){const f=await dbAll();const el=document.getElementById('uc');if(el)el.textContent=f.length}

// ============================================================
// ZIP
// ============================================================
async function handleZipUpload(files){
  if(!files.length)return;
  try{
    const zip=await JSZip.loadAsync(files[0]);curZip=[];
    zip.forEach((p,e)=>{if(!e.dir)curZip.push({path:p,entry:e,name:p.split('/').pop()})});
    document.getElementById('zip-info').textContent=`${files[0].name} — ${curZip.length} files`;
    document.getElementById('zip-files').innerHTML=curZip.map(f=>`<div class="zip-file"><span class="zf-icon">${gi(ext(f.name))}</span><span class="zf-name">${f.path}</span></div>`).join('');
    document.getElementById('zip-modal').classList.add('open');
  }catch{toast('❌ Invalid ZIP file')}
}
function closeZipModal(){document.getElementById('zip-modal').classList.remove('open')}
async function extractAllZip(){
  closeZipModal();toast('📦 Extracting...');
  for(const f of curZip){const blob=await f.entry.async('blob');await dbPut({id:'z-'+Date.now()+'-'+Math.random().toString(36).slice(2,8),name:f.name,size:blob.size,type:blob.type,ext:ext(f.name),blob,at:Date.now(),src:'zip'})}
  toast(`✅ ${curZip.length} files extracted!`);renderUploaded();updUC();curZip=[];
}

// ============================================================
// SYNC (pulls GitHub metadata — offline stores the list)
// ============================================================
async function syncGitHub(){
  toast('🔄 Syncing GitHub repos...');
  try{
    const res=await fetch('https://api.github.com/users/jtjustinktaylor-lgtm/repos?per_page=100&sort=updated');
    if(res.ok){
      const repos=await res.json();
      localStorage.setItem('pipeline-repos',JSON.stringify(repos));
      localStorage.setItem('pipeline-sync',Date.now());
      toast(`✅ Synced ${repos.length} repos!`);
    }else{toast('⚠️ Sync failed — using cached data')}
  }catch{toast('📴 Offline — using cached data')}
}

// ============================================================
// SYNTAX HIGHLIGHT
// ============================================================
function synHL(code){
  return code.replace(/(".*?"|'.*?'|`.*?`)/g,'<span style="color:#ce9178">$1</span>')
    .replace(/\b(\d+\.?\d*)\b/g,'<span style="color:#b5cea8">$1</span>')
    .replace(/\b(true|false|null|undefined|None|True|False|nil)\b/g,'<span style="color:#569cd6">$1</span>')
    .replace(/(\/\/.*$|\/\*[\s\S]*?\*\/|#.*$)/gm,'<span style="color:#6a9955">$1</span>')
    .replace(/\b(function|const|let|var|return|if|else|for|while|class|import|export|from|def|async|await|try|catch|throw|new|this|self|struct|func|fn|pub|mod|use|impl|trait|type|interface|extends|implements|super|static|public|private|protected)\b/g,'<span style="color:#c586c0">$1</span>');
}
function csvTbl(csv){
  const lines=csv.trim().split('\n');if(!lines.length)return'<p>Empty</p>';
  const hdr=lines[0].split(',').map(h=>h.trim().replace(/^"|"$/g,''));
  let h='<table><thead><tr>'+hdr.map(h=>`<th>${esc(h)}</th>`).join('')+'</tr></thead><tbody>';
  for(let i=1;i<lines.length;i++){const c=lines[i].split(',').map(c=>c.trim().replace(/^"|"$/g,''));h+='<tr>'+c.map(c=>`<td>${esc(c)}</td>`).join('')+'</tr>'}
  return h+'</tbody></table>';
}

// ============================================================
// DRAG & DROP
// ============================================================
function setupDD(){
  const z=document.getElementById('upload-zone');if(!z)return;
  z.addEventListener('dragover',e=>{e.preventDefault();z.classList.add('dragover')});
  z.addEventListener('dragleave',()=>z.classList.remove('dragover'));
  z.addEventListener('drop',e=>{e.preventDefault();z.classList.remove('dragover');const f=e.dataTransfer.files;if(f.length){if(Array.from(f).some(x=>x.name.endsWith('.zip'))&&f.length===1)handleZipUpload(f);else handleUpload(f)}});
}

// ============================================================
// OFFLINE / SERVICE WORKER
// ============================================================
function registerSW(){
  if('serviceWorker' in navigator){
    const swCode=`
const CACHE='pipeline-v2';
const ASSETS=['/','/index.html'];
self.addEventListener('install',e=>{e.waitUntil(caches.open(CACHE).then(c=>c.addAll(ASSETS)));self.skipWaiting()});
self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==CACHE).map(k=>caches.delete(k)))));self.clients.claim()});
self.addEventListener('fetch',e=>{
  if(e.request.url.includes('cdn.jsdelivr.net')){
    e.respondWith(caches.match(e.request).then(r=>{if(r)return r;return fetch(e.request).then(res=>{const c=res.clone();caches.open(CACHE).then(cache=>cache.put(e.request,c));return res})}).catch(()=>new Response('',{status:503})));
    return;
  }
  e.respondWith(fetch(e.request).then(res=>{const c=res.clone();if(res.status===200)caches.open(CACHE).then(cache=>cache.put(e.request,c));return res}).catch(()=>caches.match(e.request)));
});
`;
    const blob=new Blob([swCode],{type:'application/javascript'});
    const url=URL.createObjectURL(blob);
    navigator.serviceWorker.register(url).then(()=>console.log('SW registered')).catch(e=>console.log('SW error:',e));
  }
}

function checkOffline(){
  const badge=document.getElementById('offline-badge');
  const update=()=>{badge.classList.toggle('show',!navigator.onLine)};
  window.addEventListener('online',update);window.addEventListener('offline',update);update();
}

// ============================================================
// WORKSPACE FILE SYNC — auto-fetch bundle & load into IndexedDB
// ============================================================
const BUNDLE_URL='files-bundle.json.gz';
const BUNDLE_CACHE='pipeline-bundle-v1';

async function syncWorkspaceFiles(force=false){
  const statusEl=document.getElementById('sync-status');
  const stored=await dbAll();
  const wsFiles=stored.filter(f=>f.src==='ws');
  
  // Check if already synced (unless forced)
  const lastSync=localStorage.getItem('pipeline-ws-sync');
  if(!force && wsFiles.length>0 && lastSync && Date.now()-Number(lastSync)<3600000){
    if(statusEl)statusEl.textContent=`${wsFiles.length} files cached`;
    return;
  }
  
  if(statusEl)statusEl.textContent='Syncing workspace...';
  
  try{
    // Try cache first
    let data;
    const cache=await caches.open(BUNDLE_CACHE);
    let resp=await cache.match(BUNDLE_URL);
    
    if(!resp){
      // Fetch from server
      resp=await fetch(BUNDLE_URL);
      if(resp.ok){
        const clone=resp.clone();
        cache.put(BUNDLE_URL,clone);
      }
    }
    
    if(!resp||!resp.ok){
      if(statusEl)statusEl.textContent='Sync failed — offline?';
      return;
    }
    
    // Decompress gzipped JSON
    const compressed=await resp.arrayBuffer();
    const ds=new DecompressionStream('gzip');
    const writer=ds.writable.getWriter();
    writer.write(new Uint8Array(compressed));
    writer.close();
    const reader=ds.readable.getReader();
    const chunks=[];
    while(true){const{done,value}=await reader.read();if(done)break;chunks.push(value)}
    const totalLen=chunks.reduce((a,c)=>a+c.length,0);
    const combined=new Uint8Array(totalLen);
    let offset=0;
    for(const chunk of chunks){combined.set(chunk,offset);offset+=chunk.length}
    
    const text=new TextDecoder().decode(combined);
    const files=JSON.parse(text);
    
    // Clear old workspace files
    const tx=db.transaction(STORE,'readwrite');
    const store=tx.objectStore(STORE);
    for(const f of wsFiles){store.delete(f.id)}
    
    // Wait for clear to complete
    await new Promise((res,rej)=>{tx.oncomplete=res;tx.onerror=rej});
    
    // Load into IndexedDB in batches
    const BATCH=50;
    for(let i=0;i<files.length;i+=BATCH){
      const batch=files.slice(i,i+BATCH);
      const tx2=db.transaction(STORE,'readwrite');
      const s2=tx2.objectStore(STORE);
      for(const f of batch){
        const ext=f.p.split('.').pop().toLowerCase();
        const blob=new Blob([f.c],{type:'text/plain'});
        s2.put({
          id:'ws-'+f.p,
          name:f.p.split('/').pop(),
          path:f.p,
          size:blob.size,
          type:'text/plain',
          ext:ext,
          blob:blob,
          at:Date.now(),
          src:'ws'
        });
      }
      await new Promise((res,rej)=>{tx2.oncomplete=res;tx2.onerror=rej});
    }
    
    localStorage.setItem('pipeline-ws-sync',Date.now().toString());
    if(statusEl)statusEl.textContent=`${files.length} files synced ✓`;
    toast(`✅ ${files.length} workspace files loaded!`);
    renderFiles();
    updUC();
    
  }catch(err){
    console.error('Sync error:',err);
    if(statusEl)statusEl.textContent='Sync error';
  }
}

// ============================================================
// INIT
// ============================================================
async function init(){
  await initDB();
  renderFiles();
  renderLinks();
  updUC();
  setupDD();
  registerSW();
  checkOffline();
  
  // Auto-sync workspace files on first load
  syncWorkspaceFiles();
  
  // Pre-cache CDN libs
  caches.open('pipeline-v2').then(c=>{
    c.add('https://cdn.jsdelivr.net/npm/jszip@3/dist/jszip.min.js').catch(()=>{});
    c.add('https://cdn.jsdelivr.net/npm/marked@9/marked.min.js').catch(()=>{});
  });
}
init();
